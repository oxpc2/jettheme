<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Expressive Material 3 themes for the Jet Keyboard app.">
    <meta name="theme-color" content="#F8F9FA">
    <title>JetKeyboard | Theme Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #1F1F1F; overflow-x: hidden; }
        .glass { background: #FFFFFF; border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        .kb-preview {
            border-radius: 16px;
            height: clamp(96px, 24vw, 130px);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .key {
            width: clamp(18px, 6vw, 26px);
            height: clamp(26px, 8vw, 36px);
            border-radius: 6px;
            display: inline-block;
            margin: 2px;
        }

        /* Extra-small phones: tighten spacing further */
        @media (max-width: 380px) {
            .key { margin: 1.5px; }
        }

        .card-enter {
            opacity: 0;
            transform: translateY(12px);
            animation: cardIn 0.4s ease forwards;
        }
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .active-ring {
            outline: 2px solid #2563eb;
            outline-offset: 3px;
        }
        .active-badge {
            font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
            background: #dcfce7; color: #166534; padding: 3px 12px; border-radius: 999px;
        }
        .set-default-btn {
            font-size: 12px; font-weight: 700; padding: 10px 16px; border-radius: 999px;
            background: #F1F3F5; color: #1F1F1F; transition: all .15s ease; border: none; cursor: pointer;
            min-height: 40px; width: 100%;
        }
        .set-default-btn:hover { background: #E5E8EB; }
        .set-default-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

        @media (min-width: 640px) {
            .set-default-btn { width: auto; min-height: auto; padding: 8px 16px; }
        }

        .skeleton {
            background: linear-gradient(90deg, #E9ECEF 25%, #F1F3F5 37%, #E9ECEF 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
        }
        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        body {
            background:
                radial-gradient(ellipse at 12% 0%, rgba(191, 219, 254, 0.5), transparent 38rem),
                radial-gradient(ellipse at 92% 18%, rgba(221, 214, 254, 0.35), transparent 32rem),
                #f8f9fc;
        }
        .eyebrow { color: #516177; letter-spacing: .16em; }
        .store-card { backdrop-filter: blur(16px); }
        .kb-preview { box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
        .preview-key {
            display: inline-flex; align-items: center; justify-content: center;
            width: clamp(24px, 7vw, 38px); height: clamp(28px, 8vw, 40px);
            border-radius: 9px; font-size: clamp(10px, 2.7vw, 14px); font-weight: 700;
            box-shadow: 0 3px 6px rgba(15, 23, 42, .12);
        }
        .theme-search {
            min-height: 48px; border: 1px solid #dbe2ec; border-radius: 16px;
            background: rgba(255,255,255,.88); color: #172033;
            box-shadow: 0 8px 24px rgba(20, 34, 58, .05);
        }
        .theme-search:focus { outline: 3px solid rgba(37, 99, 235, .22); border-color: #5284e8; }
        .select-theme-btn { min-height: 42px; border-radius: 13px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-12" style="padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 sm:mb-16 gap-5 sm:gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-3xl sm:text-4xl md:text-6xl font-extrabold tracking-tight mb-2 sm:mb-3 text-slate-900">
                    Jet<span class="text-blue-600">Theme</span>
                </h1>
                <p class="text-slate-500 text-base sm:text-lg font-medium px-2 sm:px-0">Thoughtful color palettes for a keyboard that feels like yours.</p>
            </div>
            <a href="#theme-grid" class="w-full md:w-auto text-center bg-blue-600 hover:bg-blue-700 text-white px-8 sm:px-10 py-3.5 sm:py-4 rounded-2xl font-bold transition-all shadow-xl shadow-blue-500/25 active:scale-95">
                Explore palettes
            </a>
        </header>

        <section class="mb-7 sm:mb-9 flex flex-col sm:flex-row sm:items-end justify-between gap-4" aria-label="Browse themes">
            <div>
                <p class="eyebrow text-xs font-extrabold uppercase mb-2">The collection</p>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Find your flow</h2>
                <p id="theme-count" class="mt-1 text-sm text-slate-500" aria-live="polite">Loading palettes…</p>
            </div>
            <label class="w-full sm:w-80">
                <span class="sr-only">Search themes</span>
                <input id="theme-search" class="theme-search w-full px-4" type="search" placeholder="Search palettes…" autocomplete="off">
            </label>
        </section>

        <div id="theme-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-7" aria-live="polite">
            <div class="flex flex-col gap-4">
                <div class="h-36 sm:h-44 skeleton rounded-3xl"></div>
                <div class="h-6 skeleton rounded w-2/3"></div>
            </div>
            <div class="flex flex-col gap-4">
                <div class="h-36 sm:h-44 skeleton rounded-3xl"></div>
                <div class="h-6 skeleton rounded w-2/3"></div>
            </div>
            <div class="flex flex-col gap-4">
                <div class="h-36 sm:h-44 skeleton rounded-3xl"></div>
                <div class="h-6 skeleton rounded w-2/3"></div>
            </div>
        </div>

        <footer class="mt-16 sm:mt-24 md:mt-32 text-center text-slate-400 border-t border-slate-200 pt-8 sm:pt-10 pb-8 sm:pb-10 px-4">
            <p class="font-semibold text-sm sm:text-base">&copy; 2026 Jet Keyboard. Crafted with ❤️ by jetkb team.</p>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = 'jettheme_active_theme';
        const grid = document.getElementById('theme-grid');
        const search = document.getElementById('theme-search');
        const themeCount = document.getElementById('theme-count');

        function getActiveThemeId(themes) {
            let stored = null;
            try {
                stored = localStorage.getItem(STORAGE_KEY);
            } catch (error) {
                console.warn('Theme selection cannot be read in this browser:', error);
            }
            const allThemes = loadedThemes.length ? loadedThemes : themes;
            if (stored && allThemes.some(t => t.id === stored)) return stored;
            const fallback = allThemes.find(t => t.default) || allThemes[0];
            return fallback ? fallback.id : null;
        }

        function setActiveThemeId(id) {
            try {
                localStorage.setItem(STORAGE_KEY, id);
            } catch (error) {
                console.warn('Theme selection cannot be saved in this browser:', error);
            }
        }

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function validColor(value) {
            return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : '#ffffff';
        }

        function getThemeTone(theme) {
            const color = validColor(theme.colors.bgKeyboard).slice(1);
            const channels = [0, 2, 4].map(index => parseInt(color.slice(index, index + 2), 16) / 255);
            const luminance = channels.map(channel =>
                channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4
            );
            return luminance[0] * 0.2126 + luminance[1] * 0.7152 + luminance[2] * 0.0722 < 0.25 ? 'Dark' : 'Light';
        }

        function renderCard(theme, isActive, index) {
            const card = document.createElement('div');
            card.className = [
                'glass store-card rounded-3xl sm:rounded-[28px] p-5 sm:p-6 transition-all hover:-translate-y-1.5 hover:shadow-2xl hover:border-blue-500/20 group card-enter',
                isActive ? 'active-ring' : ''
            ].join(' ').trim();
            card.style.animationDelay = `${index * 60}ms`;

            const colors = theme.colors;
            const accent = validColor(colors.keyAccent);
            const preview = makeElement('div', 'kb-preview mb-5 flex flex-col justify-center items-center gap-2');
            preview.style.backgroundColor = validColor(colors.bgKeyboard);
            const letterRow = makeElement('div', 'flex gap-1');
            ['A', 'S', 'D', 'F', 'J'].forEach(letter => {
                const key = makeElement('span', 'preview-key', letter);
                key.style.backgroundColor = validColor(colors.keyBg);
                key.style.color = validColor(colors.textMain);
                letterRow.appendChild(key);
            });
            const actionRow = makeElement('div', 'flex gap-1');
            ['⌫', '123', 'space'].forEach(label => {
                const key = makeElement('span', 'preview-key', label);
                key.style.backgroundColor = validColor(colors.keyBgFunc || colors.keyBg);
                key.style.color = validColor(colors.textMain);
                if (label === 'space') key.style.width = 'clamp(48px, 15vw, 76px)';
                actionRow.appendChild(key);
            });
            const enterKey = makeElement('span', 'preview-key', '↵');
            enterKey.style.backgroundColor = accent;
            enterKey.style.color = '#ffffff';
            actionRow.appendChild(enterKey);
            preview.append(letterRow, actionRow);

            const details = makeElement('div', 'flex justify-between items-start gap-3 mb-2');
            const titleGroup = makeElement('div', 'min-w-0');
            const heading = makeElement('h3', 'text-xl font-extrabold text-slate-900 mb-1 truncate', theme.name);
            const byline = makeElement('p', 'text-slate-400 font-bold text-xs uppercase tracking-widest truncate', `${getThemeTone(theme)} palette · ${theme.author || 'JetKeyboard'}`);
            titleGroup.append(heading, byline);
            const swatch = makeElement('span', 'w-10 h-10 rounded-2xl shrink-0 shadow-inner');
            swatch.style.backgroundColor = accent;
            swatch.setAttribute('aria-label', 'Theme accent color');
            details.append(titleGroup, swatch);

            const description = makeElement('p', 'text-sm leading-relaxed text-slate-600 min-h-[42px] mb-5',
                theme.description || 'A considered palette designed for comfortable everyday typing.');
            const action = makeElement('div', 'flex items-center justify-between gap-3');
            const button = makeElement('button', 'set-default-btn select-theme-btn', isActive ? 'Selected' : 'Select theme');
            button.type = 'button';
            button.setAttribute('aria-pressed', String(isActive));
            if (isActive) {
                button.disabled = true;
                button.classList.add('!bg-blue-50', '!text-blue-800');
            } else {
                button.addEventListener('click', () => {
                    setActiveThemeId(theme.id);
                    renderThemes(currentThemes);
                });
            }
            const tone = makeElement('span', 'text-xs font-semibold text-slate-400', getThemeTone(theme));
            action.append(button, tone);
            card.append(preview, details, description, action);

            return card;
        }

        let currentThemes = [];
        let loadedThemes = [];

        function renderThemes(themes) {
            currentThemes = themes;
            const activeId = getActiveThemeId(themes);
            grid.innerHTML = '';
            themeCount.textContent = `${themes.length} ${themes.length === 1 ? 'palette' : 'palettes'} · selection is saved in this browser`;
            if (themes.length === 0) {
                grid.appendChild(makeElement('p', 'col-span-full rounded-2xl bg-white p-8 text-center font-semibold text-slate-500', 'No palettes match your search. Try a different name or color mood.'));
                return;
            }
            const frag = document.createDocumentFragment();
            themes.forEach((theme, i) => frag.appendChild(renderCard(theme, theme.id === activeId, i)));
            grid.appendChild(frag);
        }

        search.addEventListener('input', () => {
            const query = search.value.trim().toLowerCase();
            renderThemes(loadedThemes.filter(theme =>
                [theme.name, theme.author, theme.description, getThemeTone(theme)]
                    .filter(value => typeof value === 'string' && value)
                    .some(value => value.toLowerCase().includes(query))
            ));
        });

        async function loadThemes() {
            try {
                const response = await fetch('themes.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (!Array.isArray(data.themes) || data.themes.length === 0) {
                    throw new Error('No themes found');
                }

                loadedThemes = data.themes.filter(theme =>
                    theme && typeof theme.id === 'string' && typeof theme.name === 'string' &&
                    theme.colors && typeof theme.colors === 'object'
                );
                if (loadedThemes.length === 0) throw new Error('No valid themes found');
                renderThemes(loadedThemes);
            } catch (error) {
                console.error('Error loading themes:', error);
                themeCount.textContent = 'The collection could not be loaded.';
                grid.replaceChildren(makeElement('div', 'col-span-full text-center py-20 text-red-600 font-bold', 'Could not load themes.json. Please try again later.'));
            }
        }

        loadThemes();
    </script>
</body>
</html>
